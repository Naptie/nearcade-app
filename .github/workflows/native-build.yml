name: Native builds
run-name: Build Android and iOS
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - '.github/workflows/native-build.yml'

defaults:
  run:
    shell: bash

jobs:
  metadata:
    name: Retrieve metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      version-name: ${{ steps.version.outputs.VERSION }}_${{ steps.current-datetime.outputs.CURRENT_DATETIME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Specify version
        id: version
        run: echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Specify current datetime
        id: current-datetime
        run: echo "CURRENT_DATETIME=$(date +'%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  android:
    name: Build for Android
    runs-on: ubuntu-latest
    needs: metadata
    concurrency:
      group: 'native-android'
      cancel-in-progress: false
    steps:
      - name: Confirm build version
        run: echo "${{ needs.metadata.outputs.version-name }}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native project
        run: npx expo prebuild -p android --no-install

      - name: Configure release signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat >> android/gradle.properties << PROPS
          nearcadeUploadStoreFile=release.keystore
          nearcadeUploadStorePassword=$SIGNING_KEYSTORE_PASSWORD
          nearcadeUploadKeyAlias=$SIGNING_KEY_ALIAS
          nearcadeUploadKeyPassword=$SIGNING_KEYSTORE_PASSWORD
          PROPS
          node .github/scripts/patch-android-signing.cjs

      - name: Build APK and AAB
        run: |
          cd android && chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Move and rename builds
        run: |
          mkdir -p ~/artifacts/android/
          mv android/app/build/outputs/apk/release/app-release.apk \
            ~/artifacts/android/Nearcade_${{ needs.metadata.outputs.version-name }}.apk
          mv android/app/build/outputs/bundle/release/app-release.aab \
            ~/artifacts/android/Nearcade_${{ needs.metadata.outputs.version-name }}.aab
          ls -l ~/artifacts/android/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ needs.metadata.outputs.version-name }}
          path: ~/artifacts/android/*
          if-no-files-found: error

      - name: Clean up artifacts
        if: always()
        run: rm -rf ~/artifacts/

  ios:
    name: Build for iOS (unsigned)
    runs-on: macos-26
    needs: metadata
    concurrency:
      group: 'native-ios'
      cancel-in-progress: false
    steps:
      - name: Confirm build version
        run: echo "${{ needs.metadata.outputs.version-name }}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native project
        run: npx expo prebuild -p ios --no-install

      - name: Install iOS dependencies
        working-directory: ios/App
        run: pod install

      - name: Download iOS SDK
        run: |
          rm -rf ~/Library/Caches/com.apple.dt.Xcode
          rm -rf ~/Library/Developer/Xcode/DerivedData
          xcodebuild -downloadPlatform iOS

      - name: Archive without code signing
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
          -configuration Release -archivePath $RUNNER_TEMP/App.xcarchive \
          -destination 'generic/platform=iOS' -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
          clean archive

      - name: Assemble unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app \
            $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -qry Nearcade_${{ needs.metadata.outputs.version-name }}.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-${{ needs.metadata.outputs.version-name }}
          path: ${{ runner.temp }}/Nearcade_*.ipa
          if-no-files-found: error
